  <style>
    body{opacity:1!important;margin:0;background:#f6f8fc}
    .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.2rem;font-family:'Pretendard',sans-serif}
    .auth-card{width:100%;max-width:400px;background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:2rem 1.8rem;box-shadow:var(--shadow-lg)}
    .auth-logo{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.3rem}
    .auth-logo img{width:38px;height:38px}.auth-logo b{font-size:1.125rem;color:#1a3d8f}
    .auth-card h1{font-size:1.3125rem;font-weight:800;text-align:center;margin:0 0 .5rem;color:#16233a}
    .auth-card .desc{font-size:0.875rem;color:#667085;text-align:center;line-height:1.6;margin:0 0 1.2rem}
    .auth-card label{display:block;font-size:0.875rem;color:#374151;font-weight:600;margin:.9rem 0 .3rem}
    .auth-card input{width:100%;box-sizing:border-box;padding:.78rem .85rem;border:1px solid #d6dbe7;border-radius:8px;font-size:1rem;font-family:inherit}
    .auth-card input:focus{outline:none;border-color:#1a3d8f;box-shadow:0 0 0 3px rgba(26,61,143,.12)}
    .auth-btn{width:100%;margin-top:1.2rem;padding:.85rem 0;background:#1a3d8f;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}
    .auth-btn:disabled{background:#9aa6c4;cursor:not-allowed}
    .auth-links{text-align:center;margin-top:1.1rem;font-size:0.875rem}.auth-links a{color:#1a3d8f;text-decoration:none}
    .auth-msg{margin-top:1rem;font-size:0.875rem;text-align:center;min-height:1.2em}
    .auth-msg.err{color:#dc2626}.auth-msg.ok{color:#059669}
    .idinfo{margin-top:1rem;font-size:0.8125rem;color:#475569;background:#eef2fb;border:1px solid #dbe3f5;border-radius:8px;padding:.7rem .85rem;line-height:1.55}
    .auth-notice{margin-top:1rem;font-size:0.8125rem;color:#92600a;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:.7rem .85rem;line-height:1.5;text-align:center}
  
    /* ===== 아이콘 시스템 (2026-08-06) =====
       이모지 77개를 인라인 SVG 로 교체했다. 이모지는 OS 마다 다른 글리프로 렌더되어
       색·크기·baseline 을 통제할 수 없고, 다색이라 브랜드 팔레트를 깨뜨린다.
       SVG 는 currentColor 를 상속하므로 라이트/다크가 자동으로 따라온다. */
    .ico{width:1em;height:1em;display:inline-block;vertical-align:-0.125em;flex:0 0 auto;
      color:inherit;stroke:currentColor;}
    /* 맥락별 광학 크기 — 1em 상속만으로는 푸터 15px·히어로 21px 로 작게 잡힌다(실측). */
    .tgf-ic .ico{width:20px;height:20px;}
    .ic .ico,.tg-assist__ic .ico{width:24px;height:24px;}
    .tg-rev__stars .ico,.tg-rev__av .ico{width:18px;height:18px;}
    /* 별점은 비텍스트 그래픽이라 3:1 필요(WCAG 1.4.11). #E8A33A 는 흰 카드 2.16:1 미달. */
    .ico--star{color:#D97706;}
    html.dark .ico--star{color:#FFC06B;}
    @media(prefers-color-scheme:dark){html:not(.light) .ico--star{color:#FFC06B;}}
  </style>

<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="auth-logo" href="index.html"><img src="images/logo-icon.svg" alt="로고"><b>탑그래머잉글리쉬</b></a>
      <h1>아이디·비밀번호 찾기</h1>
      <p class="desc">가입하신 이메일을 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>
      <form id="resetForm">
        <label for="email">가입 이메일</label>
        <input id="email" type="email" required placeholder="example@email.com">
        <button id="resetBtn" class="auth-btn" type="submit">재설정 메일 보내기</button>
      </form>
      <div id="msg" class="auth-msg" role="alert"></div>
      <div class="idinfo"><svg class="ico" aria-hidden="true" focusable="false"><use href="#ic-info"/></svg> <strong>아이디 안내</strong>: 본 사이트는 <strong>이메일이 곧 로그인 아이디</strong>입니다. 가입에 사용하신 이메일로 로그인·재설정하세요. 이메일이 기억나지 않으면 전화(031-938-8889)로 문의해 주세요.</div>
      <div class="auth-links"><a href="login.html">로그인</a> · <a href="signup.html">회원가입</a> · <a href="index.html">홈</a></div>
      <div id="setupNotice" class="auth-notice" style="display:none">회원 시스템 연결 준비 중입니다. 문의는 전화(031-938-8889)로 가능합니다.</div>
    </div>
  </div>
